# PostgreSQL for Cheslax. Do not expose port 5432 to the public internet in production.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheslax
      POSTGRES_USER: cheslax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - cheslax_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheslax -d cheslax"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cheslax_pg:
