# Optional static hosting. Vercel is the intended deploy target for Cheslax Lite.

name: cheslax-lite

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cheslax-lite:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    mem_limit: 64m
    cpus: 0.25
