# Serves the React SPA and reverse-proxies API + SignalR.
# Upstream is the Compose service name "api" (override with API_UPSTREAM).
# Resolve at request time via Docker DNS so Nginx can start before the API is up.
# For host Nginx instead of this container, see deploy/nginx/cheslax.conf.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $cheslax_api http://${API_UPSTREAM};
        proxy_pass $cheslax_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        set $cheslax_api http://${API_UPSTREAM};
        proxy_pass $cheslax_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        set $cheslax_api http://${API_UPSTREAM};
        proxy_pass $cheslax_api;
        proxy_set_header Host $host;
    }
}
